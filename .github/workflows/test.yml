name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: AO 242 / AO 240 PDF regression tests
        run: bun run test:pdfs
      - name: Full test suite
        run: bun run test
      - name: Upload intake PDF artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intake-pdf-fixtures
          path: test-artifacts/intake-pdfs/
          if-no-files-found: ignore
          retention-days: 14
